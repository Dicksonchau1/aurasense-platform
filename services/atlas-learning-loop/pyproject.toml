[tool.poetry]
name = "atlas-learning-loop"
version = "0.1.0"
description = "ATLAS FleetOptimizer continuous-learning feedback loop"
authors = ["ATLAS Team"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "*"
asyncpg = "*"
torch = ">=2.4"
opacus = "*"
prometheus-client = "*"
pydantic = "*"
httpx = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
